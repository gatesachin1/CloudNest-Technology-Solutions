<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Source documents behind -->
  <g filter="url(#sh)">
    <rect x="574" y="70" width="168" height="210" rx="12" fill="#fff" transform="rotate(6 658 175)"/>
  </g>
  <g filter="url(#sh)">
    <rect x="560" y="84" width="168" height="210" rx="12" fill="#fff"/>
  </g>
  <rect x="580" y="104" width="34" height="40" rx="6" fill="#fee2e2"/>
  <text x="586" y="129" font-size="10" font-weight="700" fill="#b91c1c">PDF</text>
  <rect x="624" y="110" width="84" height="8" rx="4" fill="#94a3b8"/>
  <rect x="624" y="126" width="60" height="6" rx="3" fill="#cbd5e1"/>
  <g fill="#e2e8f0">
    <rect x="580" y="160" width="128" height="6" rx="3"/>
    <rect x="580" y="174" width="116" height="6" rx="3"/>
    <rect x="580" y="188" width="124" height="6" rx="3"/>
    <rect x="580" y="216" width="128" height="6" rx="3"/>
    <rect x="580" y="230" width="100" height="6" rx="3"/>
    <rect x="580" y="258" width="120" height="6" rx="3"/>
  </g>
  <rect x="576" y="184" width="136" height="14" rx="4" fill="#c4b5fd" opacity="0.45"/>

  <!-- Teams-style app window -->
  <g filter="url(#sh)">
    <rect x="50" y="60" width="560" height="390" rx="16" fill="#fff"/>
  </g>
  <rect x="50" y="60" width="64" height="390" rx="16" fill="#464775"/>
  <rect x="98" y="60" width="16" height="390" fill="#464775"/>
  <g fill="#fff" opacity="0.55">
    <rect x="70" y="86" width="24" height="24" rx="6"/>
    <rect x="70" y="130" width="24" height="24" rx="6"/>
    <rect x="70" y="174" width="24" height="24" rx="6"/>
  </g>
  <rect x="66" y="126" width="32" height="32" rx="8" fill="#fff" opacity="0.2"/>

  <rect x="114" y="60" width="496" height="54" fill="#f8fafc"/>
  <line x1="114" y1="114" x2="610" y2="114" stroke="#e2e8f0"/>
  <rect x="134" y="74" width="28" height="28" rx="8" fill="url(#bot)"/>
  <path d="M141 85h14v9h-14z M148 80v5" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <circle cx="144" cy="89" r="1.5" fill="#fff"/><circle cx="152" cy="89" r="1.5" fill="#fff"/>
  <text x="172" y="86" font-size="13" font-weight="700" fill="#0b1220">Policy Assistant</text>
  <text x="172" y="101" font-size="10" fill="#64748b">Answers from your HR and ops documents</text>

  <!-- Conversation -->
  <g font-size="11">
    <circle cx="146" cy="146" r="12" fill="#cbd5e1"/>
    <text x="168" y="142" font-size="10" font-weight="700" fill="#475569">Employee</text>
    <rect x="168" y="148" width="250" height="30" rx="10" fill="#eef2ff"/>
    <text x="180" y="167" fill="#1e293b">How many days of leave can I carry forward?</text>

    <rect x="134" y="196" width="24" height="24" rx="7" fill="url(#bot)"/>
    <text x="168" y="206" font-size="10" font-weight="700" fill="#6d28d9">Policy Assistant</text>
    <rect x="168" y="212" width="400" height="118" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="182" y="234" fill="#1e293b">You can carry forward up to 10 unused days into the</text>
    <text x="182" y="250" fill="#1e293b">next calendar year. Days beyond that lapse on 31 March.</text>

    <rect x="182" y="264" width="200" height="24" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <rect x="190" y="270" width="12" height="12" rx="2" fill="#a78bfa"/>
    <text x="208" y="280" font-size="10" fill="#6d28d9">Leave Policy 2026.pdf · p.4</text>

    <text x="182" y="312" font-size="10" fill="#64748b">Unsure? Ask HR to confirm.</text>
    <rect x="474" y="300" width="80" height="20" rx="10" fill="#f1f5f9"/>
    <text x="486" y="314" font-size="10" fill="#475569">👍  👎</text>
  </g>

  <!-- Composer -->
  <rect x="134" y="392" width="456" height="38" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="150" y="415" font-size="11" fill="#94a3b8">Ask about policies, processes, benefits…</text>
  <circle cx="568" cy="411" r="12" fill="#464775"/>
  <path d="M563 411h9M568 406l5 5-5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Retrieval link -->
  <path d="M568 270 C 600 250, 610 220, 576 196" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
  <circle cx="576" cy="196" r="4" fill="#7c3aed"/>
</svg>
