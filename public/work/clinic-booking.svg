<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Browser -->
  <g filter="url(#sh)">
    <rect x="60" y="56" width="520" height="390" rx="16" fill="#fff"/>
  </g>
  <rect x="60" y="56" width="520" height="38" rx="16" fill="#f1f5f9"/>
  <rect x="60" y="80" width="520" height="14" fill="#f1f5f9"/>
  <circle cx="84" cy="75" r="5" fill="#f87171"/><circle cx="101" cy="75" r="5" fill="#fbbf24"/><circle cx="118" cy="75" r="5" fill="#34d399"/>
  <rect x="150" y="66" width="260" height="18" rx="9" fill="#fff"/>
  <text x="164" y="79" font-size="10" fill="#64748b">yourclinic.example/book</text>

  <!-- Clinic hero -->
  <rect x="60" y="94" width="520" height="150" fill="url(#hero)"/>
  <rect x="84" y="112" width="22" height="22" rx="6" fill="#fff" opacity="0.9"/>
  <path d="M95 117v12M89 123h12" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/>
  <text x="114" y="128" font-size="13" font-weight="700" fill="#fff">CareClinic</text>
  <text x="84" y="172" font-size="22" font-weight="700" fill="#fff">Book your visit in</text>
  <text x="84" y="198" font-size="22" font-weight="700" fill="#fff">under a minute</text>
  <rect x="84" y="212" width="112" height="22" rx="11" fill="#fff"/>
  <text x="98" y="227" font-size="11" font-weight="700" fill="#0f766e">Book appointment</text>

  <!-- Slots -->
  <text x="84" y="274" font-size="12" font-weight="700" fill="#0b1220">Available today</text>
  <g font-size="11" font-weight="600">
    <rect x="84" y="286" width="72" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="100" y="305" fill="#1d4ed8">10:30</text>
    <rect x="166" y="286" width="72" height="30" rx="8" fill="#2563eb"/><text x="182" y="305" fill="#fff">11:15</text>
    <rect x="248" y="286" width="72" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="264" y="305" fill="#1d4ed8">14:00</text>
    <rect x="330" y="286" width="72" height="30" rx="8" fill="#eff6ff" stroke="#bfdbfe"/><text x="346" y="305" fill="#1d4ed8">16:45</text>
  </g>
  <g>
    <rect x="84" y="336" width="150" height="86" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="98" y="350" width="60" height="8" rx="4" fill="#94a3b8"/>
    <rect x="98" y="368" width="110" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="98" y="382" width="90" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="248" y="336" width="150" height="86" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="262" y="350" width="70" height="8" rx="4" fill="#94a3b8"/>
    <rect x="262" y="368" width="110" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="262" y="382" width="80" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="412" y="286" width="144" height="136" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <circle cx="436" cy="312" r="10" fill="#0f766e" opacity="0.15"/>
    <path d="M431 312l4 4 7-8" stroke="#0f766e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="454" y="306" width="80" height="8" rx="4" fill="#0f766e" opacity="0.5"/>
    <rect x="426" y="336" width="116" height="6" rx="3" fill="#99f6e4"/>
    <rect x="426" y="350" width="96" height="6" rx="3" fill="#99f6e4"/>
    <rect x="426" y="364" width="106" height="6" rx="3" fill="#99f6e4"/>
  </g>

  <!-- Phone with WhatsApp chat -->
  <g filter="url(#sh)">
    <rect x="548" y="96" width="200" height="370" rx="28" fill="#0b1220"/>
  </g>
  <rect x="558" y="106" width="180" height="350" rx="20" fill="#ece5dd"/>
  <rect x="558" y="106" width="180" height="50" rx="20" fill="#075e54"/>
  <rect x="558" y="136" width="180" height="20" fill="#075e54"/>
  <circle cx="584" cy="134" r="12" fill="#25d366"/>
  <path d="M579 134h10M584 129v10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="603" y="131" font-size="11" font-weight="700" fill="#fff">CareClinic</text>
  <text x="603" y="145" font-size="9" fill="#cdeee6">assistant · online</text>

  <g font-size="10">
    <rect x="618" y="172" width="108" height="34" rx="10" fill="#dcf8c6"/>
    <text x="628" y="187" fill="#1e293b">Any slot today</text>
    <text x="628" y="199" fill="#1e293b">for Dr. Mehta?</text>

    <rect x="570" y="216" width="140" height="48" rx="10" fill="#fff"/>
    <text x="580" y="232" fill="#1e293b">Yes: 11:15 or 16:45.</text>
    <text x="580" y="245" fill="#1e293b">Shall I book one</text>
    <text x="580" y="257" fill="#1e293b">for you?</text>

    <rect x="656" y="274" width="70" height="22" rx="10" fill="#dcf8c6"/>
    <text x="666" y="289" fill="#1e293b">11:15 pls</text>

    <rect x="570" y="306" width="140" height="48" rx="10" fill="#fff"/>
    <text x="580" y="322" fill="#1e293b">Booked ✓ 11:15 today.</text>
    <text x="580" y="335" fill="#1e293b">Reminder sent an hour</text>
    <text x="580" y="347" fill="#1e293b">before.</text>
  </g>
  <rect x="568" y="414" width="134" height="30" rx="15" fill="#fff"/>
  <text x="582" y="433" font-size="10" fill="#94a3b8">Type a message</text>
  <circle cx="720" cy="429" r="15" fill="#075e54"/>
  <path d="M714 429h11M721 424l5 5-5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
